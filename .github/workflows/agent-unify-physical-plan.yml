name: Agent unified physical plan cleanup

on:
  push:
    branches:
      - agent/dicebox-learnings-cards

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dicebox-learnings-cards
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Let validation report codemod leftovers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/agent-unify-physical-plan.py')
          source = path.read_text()
          before = """if 'genericPhysicalReplay' in main or 'AdditionalPhysical' in main or 'additionalPhysical' in main:\n    raise SystemExit('legacy additional-physical replay naming remains in main.ts')\n"""
          if source.count(before) != 1:
              raise SystemExit('migration guard anchor missing')
          path.write_text(source.replace(before, '', 1))
          PY
      - name: Apply unified physical plan migration
        run: python scripts/agent-unify-physical-plan.py
      - name: Apply follow-up cleanup
        run: python scripts/agent-unify-physical-plan-fixes.py
      - name: Remove one-time migration files
        run: rm -f scripts/agent-unify-physical-plan.py scripts/agent-unify-physical-plan-fixes.py .github/workflows/agent-unify-physical-plan.yml .agent-unify-physical-plan-trigger
      - name: Install pnpm
        run: npm install --global pnpm@11.17.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format migrated sources
        run: pnpm exec oxfmt src/main.ts src/roll-worker.ts src/physical-die-visuals.ts src/physical-roll-planner.ts packages/renderer/src/index.ts scripts/test-visual-fallbacks.mjs scripts/test-natural-target-physics.mjs
      - name: Reject pre-release compatibility seams
        run: |
          if grep -R "AdditionalPhysical\|additionalPhysical\|getAdditionalPhysical\|commitAdditionalPhysical\|hasPendingAdditionalPhysical\|hasConfiguredAdditionalPhysical" src packages/renderer/src; then exit 1; fi
          if grep -R "candidateAttempts\|candidateSearchMs\|assistedDiceCount\|maximumAssistAngleRadians\|continuityBlendedDiceCount" src/main.ts src/roll-worker.ts; then exit 1; fi
          if grep -R "setResults:\|clearResults:\|setDie:\|setQuantity:\|setTheme:" src/main.ts packages/renderer/src/index.ts; then exit 1; fi
          if grep -R "First die kind for backwards compatibility" src/main.ts; then exit 1; fi
      - name: Lint
        run: env -u GITHUB_ACTIONS pnpm lint
      - name: Package typecheck
        run: pnpm check:packages
      - name: Browser engine typecheck
        run: pnpm exec tsc --noEmit
      - name: TSDoc
        run: pnpm check:docs
      - name: Physical architecture smoke
        run: pnpm test:visual-fallbacks
      - name: Natural targeting regression
        run: pnpm test:natural-targets
      - name: Concurrent table regression
        run: pnpm test:concurrent-table
      - name: Mixed renderer regression
        run: pnpm test:mixed-renderer
      - name: Generated geometry regression
        run: pnpm test:generated-polyhedra
      - name: Runtime theme regression
        run: pnpm test:themes
      - name: Performance regression
        run: pnpm test:performance
      - name: Full core regression
        run: pnpm test:core
      - name: Commit validated cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "unify physical planning and replay"
          git push origin HEAD:agent/dicebox-learnings-cards
