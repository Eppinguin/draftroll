name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and type safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Print lint diagnostics
        if: failure()
        run: pnpm exec oxlint . --format=agent || true

  core-tests:
    name: Core regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Engine and evaluation
        run: pnpm test:core:engine
      - name: SDK and realtime lifecycle
        run: pnpm test:core:sdk-realtime
      - name: Mixed renderer
        run: pnpm test:mixed-renderer
      - name: Coin and canonical physics
        run: pnpm test:coin-physics
      - name: Visual fallbacks
        run: pnpm test:visual-fallbacks
      - name: Generated polyhedra
        run: pnpm test:generated-polyhedra
      - name: Card presentation
        run: pnpm test:cards-demo
      - name: Runtime themes
        run: pnpm test:themes
      - name: Room protocol and security
        run: pnpm test:core:rooms
      - name: Physics and package entrypoints
        run: pnpm test:core:physics
      - name: Public state isolation
        run: node scripts/test-state-isolation.mjs

  release-contract:
    name: Package and release contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release

  browser-chromium:
    name: Browser regression tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser:chromium
