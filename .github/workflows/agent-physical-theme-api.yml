name: Agent clean physical renderer migration

on:
  push:
    branches:
      - agent/dicebox-learnings-cards

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dicebox-learnings-cards
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Normalize one-time migration
        run: python scripts/normalize-clean-physical-migration.py
      - name: Apply breaking pre-release migration
        run: python scripts/agent-clean-physical-api.py
      - name: Clean generated migration output
        run: python scripts/clean-physical-migration-output.py
      - name: Document new public APIs
        run: python scripts/document-new-public-api.py
      - name: Remove one-time migration files
        run: rm -f scripts/agent-clean-physical-api.py scripts/agent-physical-theme-api.mjs scripts/normalize-clean-physical-migration.py scripts/clean-physical-migration-output.py scripts/document-new-public-api.py .github/workflows/agent-physical-theme-api.yml .agent-physical-theme-api-trigger
      - name: Install pnpm
        run: npm install --global pnpm@11.17.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed sources
        run: pnpm exec oxfmt packages/themes/src/index.ts packages/renderer/src/index.ts packages/renderer/src/polyhedra.ts packages/sdk/src/builders.ts packages/sdk/src/index.ts packages/sdk/src/cards.ts packages/sdk/src/deck.ts packages/overlay/src/index.ts packages/protocol/src/policy.ts packages/protocol/src/runtime.ts src/runtime-themes.ts src/physical-die-visuals.ts src/physical-die-mesh.ts src/fallback-visuals.ts src/fallback-visuals-base.ts src/dice.ts src/main.ts src/sdk-demo.ts scripts/test-runtime-themes.mjs scripts/test-visual-fallbacks.mjs scripts/test-mixed-renderer.mjs
      - name: Reject legacy physical adapters
        run: |
          ! grep -R "spinner" packages/renderer/src src/fallback-visuals.ts src/physical-die-visuals.ts
          ! grep -R "PhysicalFallback" src/physical-die-visuals.ts src/main.ts
          ! grep -R "physicalFallbackReplay" src/main.ts
          ! grep -R "forceFallback" packages src
          ! grep -R "fallbackOnly:" packages src
          ! grep -R "\.fallbackOnly" packages src
      - name: Lint
        run: env -u GITHUB_ACTIONS pnpm lint
      - name: Package typecheck
        run: pnpm check:packages
      - name: Browser engine typecheck
        run: pnpm exec tsc --noEmit
      - name: TSDoc check
        run: pnpm check:docs
      - name: Runtime theme regression
        run: pnpm test:themes
      - name: Physical architecture smoke
        run: pnpm test:visual-fallbacks
      - name: Mixed renderer regression
        run: pnpm test:mixed-renderer
      - name: Generated polyhedra regression
        run: pnpm test:generated-polyhedra
      - name: Cards regression
        run: pnpm test:cards-demo
      - name: Performance source regression
        run: pnpm test:performance
      - name: Commit validated clean architecture
        run: |
          if git diff --quiet; then
            echo "No migration changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "make physical dice the only die renderer path"
          git push origin HEAD:agent/dicebox-learnings-cards
