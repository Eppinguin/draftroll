name: Agent clean physical renderer migration

on:
  push:
    branches:
      - agent/dicebox-learnings-cards

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dicebox-learnings-cards
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Normalize one-time migration guards
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/agent-clean-physical-api.py')
          source = path.read_text()
          for line in [
              "replace_all('src/physical-die-visuals.ts', 'lastPhysicalFallbackReplay', 'lastAdditionalPhysicalReplay')\n",
              "replace_all('src/physical-die-visuals.ts', 'capturePhysicalFallbackReplay', 'captureAdditionalPhysicalReplay')\n",
              "replace_all('src/physical-die-visuals.ts', 'restorePhysicalFallbackReplay', 'restoreAdditionalPhysicalReplay')\n",
              "replace_all('src/physical-die-visuals.ts', 'physical fallback', 'additional physical')\n",
          ]:
              source = source.replace(line, '')
          old = 'r"  roll\\(\\n    request\\?:\\n      \\| \\{.*?\\n      \\| number\\[],\\n  \\): Promise<RendererCompletion>;"'
          new = 'r"  roll\\(\\n    request\\?:.*?\\n  \\): Promise<RendererCompletion>;"'
          if source.count(old) != 1:
              raise SystemExit(f'bridge-contract regex: expected one match, found {source.count(old)}')
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY
      - name: Apply breaking pre-release migration
        run: python scripts/agent-clean-physical-api.py
      - name: Remove one-time migration files
        run: rm -f scripts/agent-clean-physical-api.py scripts/agent-physical-theme-api.mjs .github/workflows/agent-physical-theme-api.yml .agent-physical-theme-api-trigger
      - name: Install pnpm
        run: npm install --global pnpm@11.17.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed sources
        run: pnpm exec oxfmt packages/themes/src/index.ts packages/renderer/src/index.ts packages/sdk/src/builders.ts src/runtime-themes.ts src/physical-die-visuals.ts src/physical-die-mesh.ts src/fallback-visuals.ts src/dice.ts src/main.ts scripts/test-runtime-themes.mjs scripts/test-visual-fallbacks.mjs scripts/test-mixed-renderer.mjs
      - name: Reject legacy physical adapters
        run: |
          ! grep -R "spinner" packages/renderer/src src/fallback-visuals.ts src/physical-die-visuals.ts
          ! grep -R "PhysicalFallback" src/physical-die-visuals.ts src/main.ts
          ! grep -R "physicalFallbackReplay" src/main.ts
      - name: Lint
        run: env -u GITHUB_ACTIONS pnpm lint
      - name: Package typecheck
        run: pnpm check:packages
      - name: Browser engine typecheck
        run: pnpm exec tsc --noEmit
      - name: TSDoc check
        run: pnpm check:docs
      - name: Runtime theme regression
        run: pnpm test:themes
      - name: Physical architecture smoke
        run: pnpm test:visual-fallbacks
      - name: Mixed renderer regression
        run: pnpm test:mixed-renderer
      - name: Generated polyhedra regression
        run: pnpm test:generated-polyhedra
      - name: Cards regression
        run: pnpm test:cards-demo
      - name: Performance source regression
        run: pnpm test:performance
      - name: Commit validated clean architecture
        run: |
          if git diff --quiet; then
            echo "No migration changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "make physical dice the only die renderer path"
          git push origin HEAD:agent/dicebox-learnings-cards
