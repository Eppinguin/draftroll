name: Agent custom physical browser coverage

on:
  push:
    branches:
      - agent/dicebox-learnings-cards

jobs:
  validate:
    if: github.ref == 'refs/heads/agent/dicebox-learnings-cards'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dicebox-learnings-cards
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Apply custom physical browser regression
        run: node scripts/agent-add-custom-physical-browser-test.mjs

      - name: Remove one-time migration files
        run: |
          rm scripts/agent-add-custom-physical-browser-test.mjs
          rm .github/workflows/agent-custom-physical-browser-test.yml

      - name: Install pnpm
        run: npm install --global pnpm@11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed sources
        run: >-
          pnpm exec oxfmt
          packages/overlay/src/index.ts
          scripts/test-browser-automation.mjs
          tests/browser/fixtures/host.ts
          tests/browser/support/fixture.ts
          tests/browser/specs/overlay.spec.ts

      - name: Lint
        run: GITHUB_ACTIONS= pnpm lint

      - name: Typecheck packages
        run: pnpm check:packages

      - name: Typecheck browser engine
        run: pnpm exec tsc --noEmit

      - name: Check API documentation
        run: pnpm check:docs

      - name: Core regression
        run: pnpm test:core

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Physical overlay regression
        run: pnpm test:browser:build && pnpm exec playwright test tests/browser/specs/overlay.spec.ts --project=chromium

      - name: Commit validated coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "forward custom physical models through overlay"
          git push origin HEAD:agent/dicebox-learnings-cards
