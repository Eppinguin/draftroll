name: Agent validate additive duplicate id

on:
  push:
    branches:
      - agent/dicebox-learnings-cards

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dicebox-learnings-cards
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: >-
          pnpm exec oxfmt --write
          src/physical-table.ts
          tests/browser/specs/additive-duplicate-id.spec.ts

      - name: Verify formatting
        run: >-
          pnpm exec oxfmt --check
          src/physical-table.ts
          tests/browser/specs/additive-duplicate-id.spec.ts

      - name: Lint and typecheck
        run: >-
          pnpm lint &&
          pnpm exec tsc --noEmit

      - name: Core regression
        run: pnpm test:core

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build browser fixtures
        run: pnpm test:browser:build

      - name: Duplicate id browser regression
        run: pnpm exec playwright test tests/browser/specs/additive-duplicate-id.spec.ts --project=chromium

      - name: Remove validation workflow
        run: |
          rm .github/workflows/agent-validate-additive-duplicate-id.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "validate additive duplicate die ids"
          git push origin HEAD:agent/dicebox-learnings-cards
