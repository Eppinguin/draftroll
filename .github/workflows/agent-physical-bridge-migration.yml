name: Agent unified physical bridge migration

on:
  push:
    branches:
      - agent/dicebox-learnings-cards

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dicebox-learnings-cards
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Fix migration template escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/agent-physical-bridge-migration.mjs')
          source = path.read_text()
          replacements = {
              "(definition?.id || `d${sides}`)": "(definition?.id || \\`d\\${sides}\\`)",
              "context.font = `800 ${fontSize}px ${getRuntimeThemeFont(spec.theme) ?? 'system-ui, sans-serif'}`;": "context.font = \\`800 \\${fontSize}px \\${getRuntimeThemeFont(spec.theme) ?? 'system-ui, sans-serif'}\\`;",
          }
          for before, after in replacements.items():
              if source.count(before) != 1:
                  raise SystemExit(f'escape fix expected one match for {before!r}, found {source.count(before)}')
              source = source.replace(before, after, 1)
          path.write_text(source)
          PY
      - name: Apply guarded migration
        run: node scripts/agent-physical-bridge-migration.mjs
      - name: Apply lint-safe migration cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_name, before, after, label):
              path = Path(path_name)
              source = path.read_text()
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              path.write_text(source.replace(before, after, 1))

          replace(
              'scripts/test-visual-fallbacks.mjs',
              'assert.match(renderer, /physical?: DraftrollPhysicalVisual[]/);',
              r'assert.match(renderer, /physical\?: DraftrollPhysicalVisual\[\]/);',
              'physical bridge regex escaping',
          )
          replace(
              'packages/renderer/src/index.ts',
              "return { kind: 'text', text: face.label ?? String(face.result) };",
              "return { kind: 'text', text: face.label ?? face.result };",
              'custom physical text label',
          )

          path = Path('src/main.ts')
          source = path.read_text()
          before = '''  const tableRolls = raw.map((value) => {\n    if (!isRecord(value) || !Array.isArray(value.dieIds)) return value;\n    const dieIds = value.dieIds.filter((id): id is string => typeof id === 'string');\n    const ids = new Set(dieIds);\n    const physicalIndexes = visualOrder\n      .filter((entry) => entry.kind === 'physical' && ids.has(entry.dieId))\n      .map((entry) => entry.index);\n    const fallbackIndexes = visualOrder\n      .filter((entry) => entry.kind === 'fallback' && ids.has(entry.dieId))\n      .map((entry) => entry.index);\n    return {\n      ...value,\n      dieIds,\n      physicalStart: physicalIndexes.length > 0 ? Math.min(...physicalIndexes) : 0,\n      physicalCount: physicalIndexes.length,\n      fallbackStart: fallbackIndexes.length > 0 ? Math.min(...fallbackIndexes) : 0,\n      fallbackCount: fallbackIndexes.length,\n      visualCount: physicalIndexes.length + fallbackIndexes.length,\n    };\n  });'''
          after = '''  const tableRolls: unknown[] = [];\n  for (const value of raw) {\n    if (!isRecord(value) || !Array.isArray(value.dieIds)) {\n      tableRolls.push(value);\n      continue;\n    }\n    const dieIds = value.dieIds.filter((id): id is string => typeof id === 'string');\n    const ids = new Set(dieIds);\n    const physicalIndexes = visualOrder\n      .filter((entry) => entry.kind === 'physical' && ids.has(entry.dieId))\n      .map((entry) => entry.index);\n    const fallbackIndexes = visualOrder\n      .filter((entry) => entry.kind === 'fallback' && ids.has(entry.dieId))\n      .map((entry) => entry.index);\n    tableRolls.push(\n      Object.assign({}, value, {\n        dieIds,\n        physicalStart: physicalIndexes.length > 0 ? Math.min(...physicalIndexes) : 0,\n        physicalCount: physicalIndexes.length,\n        fallbackStart: fallbackIndexes.length > 0 ? Math.min(...fallbackIndexes) : 0,\n        fallbackCount: fallbackIndexes.length,\n        visualCount: physicalIndexes.length + fallbackIndexes.length,\n      }),\n    );\n  }'''
          if source.count(before) != 1:
              raise SystemExit(f'table roll copy cleanup: expected one match, found {source.count(before)}')
          source = source.replace(before, after, 1)
          source = source.replace(
              "return { ...entry, index: generatedFallbacks.length + entry.index };",
              "return { kind: 'fallback', index: generatedFallbacks.length + entry.index, dieId: entry.dieId };",
              1,
          )
          source = source.replace(
              "if (canonicalIndex !== undefined) return { ...entry, index: canonicalIndex };",
              "if (canonicalIndex !== undefined) {\n      return { kind: 'physical', index: canonicalIndex, dieId: entry.dieId };\n    }",
              1,
          )
          path.write_text(source)

          path = Path('src/physical-die-visuals.ts')
          source = path.read_text()
          source = source.replace(
              "function parsePhysicalFaceContent(value: unknown): PhysicalDieFaceContent | null {\n  if (!value || typeof value !== 'object') return null;\n  const record = value as Record<string, unknown>;",
              "function isRecord(value: unknown): value is Record<string, unknown> {\n  return typeof value === 'object' && value !== null;\n}\n\nfunction parsePhysicalFaceContent(value: unknown): PhysicalDieFaceContent | null {\n  if (!isRecord(value)) return null;\n  const record = value;",
              1,
          )
          source = source.replace(
              "  if (raw && typeof raw === 'object' && Array.isArray((raw as { contents?: unknown }).contents)) {\n    const contents = (raw as { contents: unknown[] }).contents.map(parsePhysicalFaceContent);",
              "  if (isRecord(raw) && Array.isArray(raw.contents)) {\n    const contents = raw.contents.map(parsePhysicalFaceContent);",
              1,
          )
          source = source.replace('  const length = [...text].length;', '  const length = Array.from(text).length;', 1)
          path.write_text(source)
          PY
      - name: Remove one-time migration files
        run: rm -f scripts/agent-physical-bridge-migration.mjs .github/workflows/agent-physical-bridge-migration.yml .agent-physical-bridge-trigger
      - name: Install pnpm
        run: npm install --global pnpm@11.17.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed sources
        run: pnpm exec oxfmt packages/renderer/src/index.ts packages/themes/src/index.ts src/main.ts src/physical-die-visuals.ts src/runtime-themes.ts scripts/test-mixed-renderer.mjs scripts/test-visual-fallbacks.mjs
      - name: Lint
        run: env -u GITHUB_ACTIONS pnpm lint
      - name: Package typecheck
        run: pnpm check:packages
      - name: Browser engine typecheck
        run: pnpm exec tsc --noEmit
      - name: Mixed renderer regression
        run: pnpm test:mixed-renderer
      - name: Physical architecture regression
        run: pnpm test:visual-fallbacks
      - name: Generated geometry regression
        run: pnpm test:generated-polyhedra
      - name: Theme regression
        run: pnpm test:themes
      - name: Commit validated migration
        run: |
          if git diff --quiet; then
            echo "No migration changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "unify physical dice bridge contract"
          git push origin HEAD:agent/dicebox-learnings-cards
