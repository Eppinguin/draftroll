name: Agent first-class physical runtime cleanup

on:
  push:
    branches:
      - agent/dicebox-learnings-cards

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dicebox-learnings-cards
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Fix guarded migration compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/agent-physical-runtime-cleanup.mjs')
          source = path.read_text()
          fixes = [
              (
                  'createSeededRandom(\\`${seed}:\\${group.groupId}\\`)',
                  'createSeededRandom(\\`\\${seed}:\\${group.groupId}\\`)',
                  'launch seed interpolation',
              ),
              (
                  """smoke = replaceOnce(\n  smoke,\n  `const physicalVisuals = await readFile(join(root, 'src/physical-die-visuals.ts'), 'utf8');`,\n  `const physicalVisuals = await readFile(join(root, 'src/physical-die-visuals.ts'), 'utf8');\\nconst physicalMesh = await readFile(join(root, 'src/physical-die-mesh.ts'), 'utf8');\\nconst physicalLaunch = await readFile(join(root, 'src/physical-launch.ts'), 'utf8');`,\n  'smoke reads physical mesh and launch',\n);""",
                  """smoke = replaceOnce(\n  smoke,\n  `  physicalVisuals,\\n  physicalPlanner,`,\n  `  physicalVisuals,\\n  physicalMesh,\\n  physicalLaunch,\\n  physicalPlanner,`,\n  'smoke result slots for physical mesh and launch',\n);\nsmoke = replaceOnce(\n  smoke,\n  `  readFile(new URL('../src/physical-die-visuals.ts', import.meta.url), 'utf8'),\\n  readFile(new URL('../src/physical-roll-planner.ts', import.meta.url), 'utf8'),`,\n  `  readFile(new URL('../src/physical-die-visuals.ts', import.meta.url), 'utf8'),\\n  readFile(new URL('../src/physical-die-mesh.ts', import.meta.url), 'utf8'),\\n  readFile(new URL('../src/physical-launch.ts', import.meta.url), 'utf8'),\\n  readFile(new URL('../src/physical-roll-planner.ts', import.meta.url), 'utf8'),`,\n  'smoke reads physical mesh and launch',\n);""",
                  'smoke promise-all anchor',
              ),
          ]
          for before, after, label in fixes:
              if source.count(before) != 1:
                  raise SystemExit(f'{label}: expected one match, found {source.count(before)}')
              source = source.replace(before, after, 1)
          path.write_text(source)
          PY
      - name: Check migration syntax
        run: node --check scripts/agent-physical-runtime-cleanup.mjs
      - name: Apply guarded migration
        run: node scripts/agent-physical-runtime-cleanup.mjs
      - name: Apply runtime cleanup source fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/physical-launch.ts')
          source = path.read_text()
          before = 'angularVelocity: angularVelocity as [number, number, number],'
          after = 'angularVelocity: [angularVelocity[0], angularVelocity[1], angularVelocity[2]],'
          if source.count(before) != 1:
              raise SystemExit(f'angular velocity tuple: expected one match, found {source.count(before)}')
          path.write_text(source.replace(before, after, 1))

          path = Path('src/physical-die-mesh.ts')
          source = path.read_text()
          before = 'score: normal.dot(new THREE.Vector3(...outcome.settledUp)),'
          after = '''score: Math.max(\n          ...outcome.supportNormals.map((support) =>\n            -normal.dot(new THREE.Vector3(...support)),\n          ),\n        ),'''
          if source.count(before) != 1:
              raise SystemExit(f'support-state score: expected one match, found {source.count(before)}')
          path.write_text(source.replace(before, after, 1))

          path = Path('scripts/test-visual-fallbacks.mjs')
          source = path.read_text()
          replacements = {
              'assert.match(physicalVisuals, /presentationTexture/);': 'assert.match(physicalMesh, /presentationTexture/);',
              "assert.match(physicalVisuals, /content.kind === 'icon'/);": "assert.match(physicalMesh, /content.kind === 'icon'/);",
              'assert.match(physicalVisuals, /getRuntimeThemeTexture/);': 'assert.match(physicalMesh, /getRuntimeThemeTexture/);',
              'assert.match(physicalVisuals, /getRuntimeThemeMaterial/);': 'assert.match(physicalMesh, /getRuntimeThemeMaterial/);',
              'assert.match(physicalVisuals, /getRuntimeThemeMesh/);': 'assert.match(physicalMesh, /getRuntimeThemeMesh/);',
              'assert.match(physicalVisuals, /function atlasCellTexture/);': 'assert.match(physicalMesh, /function atlasCellTexture/);',
              'assert.match(physicalVisuals, /LABEL_ATLAS_COLUMNS = 5/);': 'assert.match(physicalMesh, /LABEL_ATLAS_COLUMNS = 5/);',
              'assert.match(physicalVisuals, /LABEL_ATLAS_ROWS = 4/);': 'assert.match(physicalMesh, /LABEL_ATLAS_ROWS = 4/);',
              "assert.match(physicalVisuals, /getRuntimeThemeTexture\\(spec\\.theme, spec\\.type, 'label'\\)/);": "assert.match(physicalMesh, /getRuntimeThemeTexture\\(spec\\.theme, spec\\.type, 'label'\\)/);",
              'assert.match(physicalVisuals, /ownedLabelTextures/);': 'assert.match(physicalMesh, /ownedTextures/);',
              'assert.doesNotMatch(fallbackVisuals, /createGeneratedDieVisual/);': 'assert.doesNotMatch(visualBase, /createGeneratedDieVisual/);',
              'assert.doesNotMatch(fallbackVisuals, /createReadablePolyhedron/);': 'assert.doesNotMatch(visualBase, /createReadablePolyhedron/);',
          }
          for before, after in replacements.items():
              old_count = source.count(before)
              new_count = source.count(after)
              if old_count == 1:
                  source = source.replace(before, after, 1)
              elif old_count == 0 and new_count >= 1:
                  continue
              else:
                  raise SystemExit(
                      f'physical mesh smoke ownership {before}: old={old_count}, new={new_count}'
                  )
          path.write_text(source)
          PY
      - name: Remove one-time migration files
        run: rm -f scripts/agent-physical-runtime-cleanup.mjs .github/workflows/agent-physical-runtime-cleanup.yml .agent-physical-runtime-cleanup-trigger
      - name: Install pnpm
        run: npm install --global pnpm@11.17.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed sources
        run: pnpm exec oxfmt src/main.ts src/physical-die-visuals.ts src/physical-die-mesh.ts src/physical-launch.ts src/fallback-visuals-base.ts scripts/test-visual-fallbacks.mjs scripts/test-natural-target-physics.mjs scripts/test-large-pool-physics.mjs
      - name: Lint
        run: env -u GITHUB_ACTIONS pnpm lint
      - name: Package typecheck
        run: pnpm check:packages
      - name: Browser engine typecheck
        run: pnpm exec tsc --noEmit
      - name: Physical architecture smoke
        run: pnpm test:visual-fallbacks
      - name: Natural targeting regression
        run: pnpm test:natural-targets
      - name: Large-pool regression
        run: pnpm test:large-pools
      - name: Mixed renderer regression
        run: pnpm test:mixed-renderer
      - name: Generated geometry regression
        run: pnpm test:generated-polyhedra
      - name: Performance source regression
        run: pnpm test:performance
      - name: Commit validated cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "finish first-class physical die runtime"
          git push origin HEAD:agent/dicebox-learnings-cards
