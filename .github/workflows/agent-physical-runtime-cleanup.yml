name: Agent first-class physical runtime cleanup

on:
  push:
    branches:
      - agent/dicebox-learnings-cards

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dicebox-learnings-cards
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Check migration syntax
        run: node --check scripts/agent-physical-runtime-cleanup.mjs
      - name: Apply guarded migration
        run: node scripts/agent-physical-runtime-cleanup.mjs
      - name: Remove one-time migration files
        run: rm -f scripts/agent-physical-runtime-cleanup.mjs .github/workflows/agent-physical-runtime-cleanup.yml .agent-physical-runtime-cleanup-trigger
      - name: Install pnpm
        run: npm install --global pnpm@11.17.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed sources
        run: pnpm exec oxfmt src/main.ts src/physical-die-visuals.ts src/physical-die-mesh.ts src/physical-launch.ts src/fallback-visuals-base.ts scripts/test-visual-fallbacks.mjs scripts/test-natural-target-physics.mjs scripts/test-large-pool-physics.mjs
      - name: Lint
        run: env -u GITHUB_ACTIONS pnpm lint
      - name: Package typecheck
        run: pnpm check:packages
      - name: Browser engine typecheck
        run: pnpm exec tsc --noEmit
      - name: Physical architecture smoke
        run: pnpm test:visual-fallbacks
      - name: Natural targeting regression
        run: pnpm test:natural-targets
      - name: Large-pool regression
        run: pnpm test:large-pools
      - name: Mixed renderer regression
        run: pnpm test:mixed-renderer
      - name: Generated geometry regression
        run: pnpm test:generated-polyhedra
      - name: Performance source regression
        run: pnpm test:performance
      - name: Commit validated cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "finish first-class physical die runtime"
          git push origin HEAD:agent/dicebox-learnings-cards
