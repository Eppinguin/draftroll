name: Agent generated physical browser regression

on:
  push:
    branches:
      - agent/dicebox-learnings-cards

jobs:
  validate:
    if: github.ref == 'refs/heads/agent/dicebox-learnings-cards'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dicebox-learnings-cards
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Apply generated physical browser regression
        run: node scripts/agent-strengthen-generated-physical-browser-regression.mjs

      - name: Refine additive and drag browser coverage
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          function replaceOnce(source, search, replacement, label) {
            const count = source.split(search).length - 1;
            if (count !== 1) throw new Error(`${label}: expected one match, found ${count}`);
            return source.replace(search, replacement);
          }

          function replaceBetween(source, start, end, replacement, label) {
            const startIndex = source.indexOf(start);
            if (startIndex < 0) throw new Error(`${label}: start marker not found`);
            const endIndex = source.indexOf(end, startIndex + start.length);
            if (endIndex < 0) throw new Error(`${label}: end marker not found`);
            return source.slice(0, startIndex) + replacement + source.slice(endIndex);
          }

          {
            const path = 'src/main.ts';
            let source = await readFile(path, 'utf8');
            source = replaceOnce(
              source,
              `        position: { x: number; y: number; z: number };\n        quaternion: { x: number; y: number; z: number; w: number };`,
              `        position: { x: number; y: number; z: number };\n        quaternion: { x: number; y: number; z: number; w: number };\n        screenPosition: { x: number; y: number };`,
              'physical snapshot screen position type',
            );
            source = replaceOnce(
              source,
              `      const definitionTargeting =\n        spec.definition?.targeting ?? (spec.canonicalKind ? 'symmetry' : 'relabel');\n      return {`,
              `      const projected = position.clone().project(camera);\n      const canvasBounds = canvas.getBoundingClientRect();\n      const definitionTargeting =\n        spec.definition?.targeting ?? (spec.canonicalKind ? 'symmetry' : 'relabel');\n      return {`,
              'physical snapshot projection',
            );
            source = replaceOnce(
              source,
              `        quaternion: {\n          x: quaternion.x,\n          y: quaternion.y,\n          z: quaternion.z,\n          w: quaternion.w,\n        },`,
              `        quaternion: {\n          x: quaternion.x,\n          y: quaternion.y,\n          z: quaternion.z,\n          w: quaternion.w,\n        },\n        screenPosition: {\n          x: ((projected.x + 1) / 2) * canvasBounds.width,\n          y: ((1 - projected.y) / 2) * canvasBounds.height,\n        },`,
              'physical snapshot projected screen position',
            );
            await writeFile(path, source);
          }

          {
            const path = 'tests/browser/fixtures/host.ts';
            let source = await readFile(path, 'utf8');
            source = replaceOnce(
              source,
              `  rollLocalAdditive(expression?: string): Promise<{ total: number; dice: number }>;\n`,
              '',
              'remove invalid independent additive fixture api',
            );
            source = replaceOnce(
              source,
              `  rollLocalAdditive,\n`,
              '',
              'remove invalid independent additive fixture binding',
            );
            source = replaceBetween(
              source,
              `async function rollLocalAdditive(`,
              `async function rollLocalWithPhysicsPreset(`,
              '',
              'remove invalid independent additive fixture implementation',
            );
            await writeFile(path, source);
          }

          {
            const path = 'tests/browser/specs/overlay.spec.ts';
            let source = await readFile(path, 'utf8');
            const additiveStart = `test('additive generated physical roll preserves settled canonical dice', async ({ page }) => {`;
            const additiveEnd = `test('generated physical dice receive heavy and low-gravity planner presets', async ({ page }) => {`;
            const additiveReplacement = `test('additive generated physical roll preserves settled canonical dice', async ({ page }) => {\n  await page.goto('/host.html');\n  await waitForFixture(page);\n  const frame = page.frameLocator('iframe[title="Draftroll dice overlay"]');\n\n  const firstCompletion = await frame.locator('body').evaluate(() =>\n    window.draftrollDice.roll({\n      physical: [\n        {\n          id: 'add-canonical-d6',\n          type: 'd6',\n          sides: 6,\n          outcomeIndex: 2,\n          result: 3,\n          numericValue: 3,\n          canonicalKind: 'd6',\n          title: 'd6',\n          label: '3',\n          theme: 'dragon',\n          outcome: 'neutral',\n        },\n      ],\n      visualOrder: [{ kind: 'physical', index: 0, dieId: 'add-canonical-d6' }],\n      seed: 'additive-canonical',\n      animationDurationMs: 720,\n    }),\n  );\n  expect(firstCompletion.presentationMode).toBe('replace');\n  const before = await frame\n    .locator('body')\n    .evaluate(() => window.draftrollDice.getPhysicalSnapshot());\n  expect(before).toHaveLength(1);\n  expect(before[0]).toMatchObject({\n    id: 'add-canonical-d6',\n    implementation: 'canonical',\n    requestedOutcomeIndex: 2,\n    displayedOutcomeIndex: 2,\n    result: 3,\n  });\n\n  const additiveCompletion = await frame.locator('body').evaluate(() =>\n    window.draftrollDice.roll({\n      physical: [\n        {\n          id: 'add-generated-d9',\n          type: 'd9',\n          sides: 9,\n          outcomeIndex: 4,\n          result: 5,\n          numericValue: 5,\n          title: 'd9',\n          label: '5',\n          theme: 'dragon',\n          outcome: 'neutral',\n        },\n      ],\n      visualOrder: [{ kind: 'physical', index: 0, dieId: 'add-generated-d9' }],\n      seed: 'additive-generated',\n      animationDurationMs: 720,\n      tableMode: 'add',\n    }),\n  );\n  expect(additiveCompletion.presentationMode).toBe('add');\n  const after = await frame\n    .locator('body')\n    .evaluate(() => window.draftrollDice.getPhysicalSnapshot());\n  expect(after).toHaveLength(2);\n  expect(after.find((entry) => entry.id === 'add-canonical-d6')).toMatchObject({\n    implementation: 'canonical',\n    requestedOutcomeIndex: 2,\n    displayedOutcomeIndex: 2,\n    result: 3,\n    visible: true,\n  });\n  const generated = after.find((entry) => entry.id === 'add-generated-d9');\n  expect(generated).toMatchObject({\n    implementation: 'generated',\n    targeting: 'relabel',\n    requestedOutcomeIndex: 4,\n    displayedOutcomeIndex: 4,\n    result: 5,\n    visible: true,\n  });\n});\n\n`;
            source = replaceBetween(
              source,
              additiveStart,
              additiveEnd,
              additiveReplacement,
              'renderer-native additive physical coverage',
            );
            source = replaceOnce(
              source,
              `  const viewportScale = box!.height / 10;\n  const startX = box!.x + box!.width / 2 + before.position.x * viewportScale;\n  const startY = box!.y + box!.height / 2 + before.position.z * viewportScale;`,
              `  const startX = box!.x + before.screenPosition.x;\n  const startY = box!.y + before.screenPosition.y;`,
              'projected generated drag target',
            );
            await writeFile(path, source);
          }
          NODE

      - name: Use a lint-safe iframe pointer override
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'tests/browser/specs/overlay.spec.ts';
          let source = await readFile(path, 'utf8');
          const before = "    (element as HTMLElement).style.pointerEvents = 'auto';";
          const after = "    element.setAttribute('style', `${element.getAttribute('style') ?? ''}; pointer-events: auto;`);";
          if (!source.includes(before)) throw new Error('iframe pointer override marker is missing');
          source = source.replace(before, after);
          await writeFile(path, source);
          NODE

      - name: Fix host overlay interaction forwarding
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          function replaceOnce(source, search, replacement, label) {
            const count = source.split(search).length - 1;
            if (count !== 1) throw new Error(`${label}: expected one match, found ${count}`);
            return source.replace(search, replacement);
          }

          {
            const path = 'packages/overlay/src/index.ts';
            let source = await readFile(path, 'utf8');
            source = replaceOnce(
              source,
              `  private participantFilter?: RendererParticipantFilter;\n`,
              `  private participantFilter?: RendererParticipantFilter;\n  private interactionOptions: Required<RendererInteractionOptions> = {\n    click: 'none',\n    draggable: false,\n  };\n`,
              'overlay interaction state',
            );
            source = replaceOnce(
              source,
              `  async configureInteractions(options: RendererInteractionOptions): Promise<void> {\n    await this.command({ type: 'configure-interactions', options });\n  }`,
              `  async configureInteractions(options: RendererInteractionOptions): Promise<void> {\n    const next = {\n      click: options.click ?? this.interactionOptions.click,\n      draggable: options.draggable ?? this.interactionOptions.draggable,\n    };\n    await this.command({ type: 'configure-interactions', options });\n    this.interactionOptions = next;\n    if (this.iframe) {\n      this.iframe.style.pointerEvents =\n        next.click === 'none' && !next.draggable ? 'none' : 'auto';\n    }\n  }`,
              'overlay configure interactions',
            );
            await writeFile(path, source);
          }

          {
            const path = 'tests/browser/fixtures/host.ts';
            let source = await readFile(path, 'utf8');
            source = replaceOnce(
              source,
              `  rollLocalWithPhysicalModel(expression?: string): Promise<{ total: number; dice: number }>;\n`,
              `  rollLocalWithPhysicalModel(expression?: string): Promise<{ total: number; dice: number }>;\n  configureOverlayDrag(draggable?: boolean): Promise<void>;\n`,
              'fixture overlay drag api',
            );
            source = replaceOnce(
              source,
              `  rollLocalWithPhysicsPreset,\n  rollLocalWithPhysicalModel,\n  connectRoom,`,
              `  rollLocalWithPhysicsPreset,\n  rollLocalWithPhysicalModel,\n  configureOverlayDrag,\n  connectRoom,`,
              'fixture overlay drag binding',
            );
            source = replaceOnce(
              source,
              `async function rollLocalWithPhysicalModel(\n`,
              `async function configureOverlayDrag(draggable = true): Promise<void> {\n  await ready;\n  if (!overlay) throw new Error('Overlay renderer is unavailable');\n  await overlay.configureInteractions({ draggable });\n}\n\nasync function rollLocalWithPhysicalModel(\n`,
              'fixture overlay drag implementation',
            );
            await writeFile(path, source);
          }

          {
            const path = 'tests/browser/specs/overlay.spec.ts';
            let source = await readFile(path, 'utf8');
            source = replaceOnce(
              source,
              `  const firstCompletion = await frame.locator('body').evaluate(() =>\n`,
              `  await frame.locator('body').evaluate(() =>\n`,
              'remove first additive completion binding',
            );
            source = replaceOnce(
              source,
              `  );\n  expect(firstCompletion.presentationMode).toBe('replace');\n  const before = await frame\n`,
              `  );\n  const before = await frame\n`,
              'remove first additive presentation mode assertion',
            );
            source = replaceOnce(
              source,
              `  const additiveCompletion = await frame.locator('body').evaluate(() =>\n`,
              `  await frame.locator('body').evaluate(() =>\n`,
              'remove additive completion binding',
            );
            source = replaceOnce(
              source,
              `  );\n  expect(additiveCompletion.presentationMode).toBe('add');\n  const after = await frame\n`,
              `  );\n  const after = await frame\n`,
              'remove additive presentation mode assertion',
            );
            source = replaceOnce(
              source,
              `  await frame\n    .locator('body')\n    .evaluate(() => window.draftrollDice.configureInteractions({ draggable: true }));\n  await iframe.evaluate((element) => {\n    element.setAttribute('style', \`${'${'}element.getAttribute('style') ?? ''}; pointer-events: auto;\`);\n  });\n`,
              `  await page.evaluate(() => window.__draftrollTest.configureOverlayDrag(true));\n  await expect(iframe).toHaveCSS('pointer-events', 'auto');\n`,
              'public overlay drag configuration',
            );
            source = replaceOnce(
              source,
              `  await page.mouse.move(startX, startY);\n  await page.mouse.down();`,
              `  await canvas.hover({ position: before.screenPosition });\n  await page.mouse.down();`,
              'iframe-local generated drag start',
            );
            await writeFile(path, source);
          }
          NODE

      - name: Remove one-time migration files
        run: |
          rm scripts/agent-strengthen-generated-physical-browser-regression.mjs
          rm .github/workflows/agent-generated-physical-browser-regression.yml

      - name: Install pnpm
        run: npm install --global pnpm@11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed sources
        run: >-
          pnpm exec oxfmt
          packages/overlay/src/index.ts
          src/main.ts
          src/physical-die-visuals.ts
          scripts/test-browser-automation.mjs
          tests/browser/fixtures/host.ts
          tests/browser/specs/overlay.spec.ts

      - name: Lint
        run: GITHUB_ACTIONS= pnpm lint

      - name: Typecheck packages
        run: pnpm check:packages

      - name: Typecheck browser engine
        run: pnpm exec tsc --noEmit

      - name: Check API documentation
        run: pnpm check:docs

      - name: Core regression
        run: pnpm test:core

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Generated physical browser regression
        run: pnpm test:browser:build && pnpm exec playwright test tests/browser/specs/overlay.spec.ts --project=chromium

      - name: Commit validated regression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "strengthen generated physical browser regression"
          git push origin HEAD:agent/dicebox-learnings-cards
