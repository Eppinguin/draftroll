name: Agent generated physical browser regression

on:
  push:
    branches:
      - agent/dicebox-learnings-cards

jobs:
  validate:
    if: github.ref == 'refs/heads/agent/dicebox-learnings-cards'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dicebox-learnings-cards
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Apply generated physical browser regression
        run: node scripts/agent-strengthen-generated-physical-browser-regression.mjs

      - name: Use a lint-safe iframe pointer override
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'tests/browser/specs/overlay.spec.ts';
          let source = await readFile(path, 'utf8');
          const before = "    (element as HTMLElement).style.pointerEvents = 'auto';";
          const after = "    element.setAttribute('style', `${element.getAttribute('style') ?? ''}; pointer-events: auto;`);";
          if (!source.includes(before)) throw new Error('iframe pointer override marker is missing');
          source = source.replace(before, after);
          await writeFile(path, source);
          NODE

      - name: Remove one-time migration files
        run: |
          rm scripts/agent-strengthen-generated-physical-browser-regression.mjs
          rm .github/workflows/agent-generated-physical-browser-regression.yml

      - name: Install pnpm
        run: npm install --global pnpm@11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed sources
        run: >-
          pnpm exec oxfmt
          src/main.ts
          src/physical-die-visuals.ts
          scripts/test-browser-automation.mjs
          tests/browser/fixtures/host.ts
          tests/browser/specs/overlay.spec.ts

      - name: Lint
        run: GITHUB_ACTIONS= pnpm lint

      - name: Typecheck packages
        run: pnpm check:packages

      - name: Typecheck browser engine
        run: pnpm exec tsc --noEmit

      - name: Check API documentation
        run: pnpm check:docs

      - name: Core regression
        run: pnpm test:core

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Generated physical browser regression
        run: pnpm test:browser:build && pnpm exec playwright test tests/browser/specs/overlay.spec.ts --project=chromium

      - name: Commit validated regression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "strengthen generated physical browser regression"
          git push origin HEAD:agent/dicebox-learnings-cards
