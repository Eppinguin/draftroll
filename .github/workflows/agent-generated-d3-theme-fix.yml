name: Agent generated d3 theme parity

on:
  push:
    branches:
      - agent/dicebox-learnings-cards

jobs:
  generated-d3-theme-parity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dicebox-learnings-cards
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Apply d3 theme parity fix
        run: |
          node --check scripts/agent-fix-generated-d3-theme.mjs
          node scripts/agent-fix-generated-d3-theme.mjs
          rm scripts/agent-fix-generated-d3-theme.mjs
          rm .github/workflows/agent-generated-d3-theme-fix.yml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: >-
          pnpm exec oxfmt --write
          src/dice.ts
          src/physical-die-mesh.ts
          scripts/test-visual-fallbacks.mjs
          docs/ARCHITECTURE.md

      - name: Verify formatting
        run: >-
          pnpm exec oxfmt --check
          src/dice.ts
          src/physical-die-mesh.ts
          scripts/test-visual-fallbacks.mjs
          docs/ARCHITECTURE.md

      - name: Lint and typecheck
        run: >-
          pnpm lint &&
          pnpm exec tsc --noEmit

      - name: Core regression
        run: pnpm test:core

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build browser fixtures
        run: pnpm test:browser:build

      - name: Overlay browser regression
        run: pnpm exec playwright test tests/browser/specs/overlay.spec.ts --project=chromium

      - name: Commit validated implementation
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Implementation produced no changes"
            exit 1
          fi
          git commit -m "align generated d3 with theme visuals"
          git push origin HEAD:agent/dicebox-learnings-cards
