name: Agent finalize physical runtime

on:
  push:
    branches:
      - agent/dicebox-learnings-cards

jobs:
  validate:
    if: github.ref == 'refs/heads/agent/dicebox-learnings-cards'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dicebox-learnings-cards
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Apply final physical runtime architecture
        run: node scripts/agent-finalize-physical-runtime.mjs

      - name: Apply migration cleanup
        run: node scripts/agent-finish-finalize-physical-runtime.mjs

      - name: Remove one-time migration files
        run: |
          rm scripts/agent-finalize-physical-runtime.mjs
          rm scripts/agent-finish-finalize-physical-runtime.mjs
          rm .github/workflows/agent-finalize-physical-runtime.yml
          rm .agent-finalize-physical-runtime-trigger

      - name: Install pnpm
        run: npm install --global pnpm@11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed sources
        run: >-
          pnpm exec oxfmt
          packages/renderer/src/physical.ts
          packages/renderer/src/index.ts
          src/main.ts
          src/physical-table.ts
          src/physical-die-visuals.ts
          src/physical-die-mesh.ts
          src/roll-worker.ts
          scripts/test-visual-fallbacks.mjs
          tests/browser/specs/overlay.spec.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck packages
        run: pnpm check:packages

      - name: Typecheck browser engine
        run: pnpm exec tsc --noEmit

      - name: Check API documentation
        run: pnpm check:docs

      - name: Core regression
        run: pnpm test:core

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Physical overlay regression
        run: pnpm test:browser:build && pnpm exec playwright test tests/browser/specs/overlay.spec.ts --project=chromium

      - name: Commit validated architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "finalize first-class physical dice runtime"
          git push origin HEAD:agent/dicebox-learnings-cards
