name: Agent physical architecture migration

on:
  push:
    branches:
      - agent/dicebox-learnings-cards

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dicebox-learnings-cards
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Remove obsolete migration guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/agent-physical-main-migration.mjs')
          source = path.read_text()
          block = """main = replaceOnce(\n  main,\n  `  diagnostics?: RollPlanDiagnostics;\\n}`,\n  `  diagnostics?: RollPlanDiagnostics;\\n}`,\n  'roll plan stable anchor',\n);\n"""
          if block not in source:
              raise SystemExit('obsolete migration guard not found')
          path.write_text(source.replace(block, '', 1))
          PY
      - name: Apply guarded migration
        run: node scripts/agent-physical-main-migration.mjs
      - name: Apply branch lint cleanups
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_name, before, after, label):
              path = Path(path_name)
              source = path.read_text()
              if source.count(before) != 1:
                  raise SystemExit(f'{label}: expected one match, found {source.count(before)}')
              path.write_text(source.replace(before, after, 1))

          replace(
              'src/physical-dices.ts',
              '    const face = [...source];',
              '    const face = source.slice();',
              'convex face copy',
          )

          replace(
              'packages/sdk/src/deck.ts',
              'function shuffle<T>(items: T[], sampleIndex: IndexSampler): void {',
              'function shuffle(items: unknown[], sampleIndex: IndexSampler): void {',
              'deck shuffle generic',
          )
          replace(
              'packages/sdk/src/deck.ts',
              '''    const total = cards.reduce((sum, card) => sum + card.numericValue, 0);\n    const deck = this;\n    return Object.freeze({ deckId: this.id, cards: Object.freeze(cards.map(cloneCard)), total,\n      toDisplayInput(options: DraftrollCardDisplayOptions = {}): DisplayRollInput {\n        const dice: ExternalDieResult[] = cards.map((card) => ({\n          id: card.id, type: deck.id, customDiceId: deck.id, faceIndex: card.faceIndex,\n          result: card.result, numericValue: card.numericValue, kept: true, generatedBy: 'external',\n          metadata: { ...cloneMeta(card.metadata), deckId: deck.id, copyIndex: card.copyIndex },\n        }));\n        return { mode: 'display', dice, total, name: options.name, expression: options.expression,\n          themeId: options.themeId, annotation: options.annotation, comment: options.comment,\n          customDice: [deck.definition], metadata: { ...cloneMeta(options.metadata), deckId: deck.id, cardDraw: true } };\n      },\n    });''',
              '''    const total = cards.reduce((sum, card) => sum + card.numericValue, 0);\n    return Object.freeze({\n      deckId: this.id,\n      cards: Object.freeze(cards.map(cloneCard)),\n      total,\n      toDisplayInput: (options: DraftrollCardDisplayOptions = {}): DisplayRollInput => {\n        const dice: ExternalDieResult[] = cards.map((card) => ({\n          id: card.id,\n          type: this.id,\n          customDiceId: this.id,\n          faceIndex: card.faceIndex,\n          result: card.result,\n          numericValue: card.numericValue,\n          kept: true,\n          generatedBy: 'external',\n          metadata: { ...cloneMeta(card.metadata), deckId: this.id, copyIndex: card.copyIndex },\n        }));\n        return {\n          mode: 'display',\n          dice,\n          total,\n          name: options.name,\n          expression: options.expression,\n          themeId: options.themeId,\n          annotation: options.annotation,\n          comment: options.comment,\n          customDice: [this.definition],\n          metadata: { ...cloneMeta(options.metadata), deckId: this.id, cardDraw: true },\n        };\n      },\n    });''',
              'deck draw closure',
          )

          replace(
              'src/fallback-visuals-base.ts',
              "  return Object.hasOwn(THEMES, theme) ? (theme as ThemeName) : 'dragon';",
              "  return Object.hasOwn(THEMES, theme) ? theme : 'dragon';",
              'fallback theme narrowing',
          )
          replace(
              'src/fallback-visuals-base.ts',
              'context.strokeText(String(spec.label), 320, 210);',
              'context.strokeText(spec.label, 320, 210);',
              'fallback stroke label',
          )
          replace(
              'src/fallback-visuals-base.ts',
              'context.fillText(String(spec.label), 320, 210);',
              'context.fillText(spec.label, 320, 210);',
              'fallback fill label',
          )
          replace(
              'src/fallback-visuals-base.ts',
              "const rank = metadataString(spec, 'rank') ?? (spec.metadata?.joker ? '★' : String(spec.label));",
              "const rank = metadataString(spec, 'rank') ?? (spec.metadata?.joker ? '★' : spec.label);",
              'card rank label',
          )

          replace(
              'src/cards-demo.ts',
              '''function requireElement<T extends Element>(selector: string): T {\n  const element = document.querySelector<T>(selector);\n  if (!element) throw new Error(`Missing cards demo element: ${selector}`);\n  return element;\n}''',
              '''type ElementConstructor<T extends Element> = new () => T;\n\nfunction requireElement<T extends Element>(\n  selector: string,\n  constructor: ElementConstructor<T>,\n): T {\n  const element = document.querySelector(selector);\n  if (!(element instanceof constructor)) {\n    throw new Error(`Missing or invalid cards demo element: ${selector}`);\n  }\n  return element;\n}''',
              'cards demo element helper',
          )
          calls = {
              "requireElement<HTMLElement>('#card-remaining')": "requireElement('#card-remaining', HTMLElement)",
              "requireElement<HTMLElement>('#card-discarded')": "requireElement('#card-discarded', HTMLElement)",
              "requireElement<HTMLElement>('#discard-top')": "requireElement('#discard-top', HTMLElement)",
              "requireElement<HTMLSelectElement>('#card-draw-count')": "requireElement('#card-draw-count', HTMLSelectElement)",
              "requireElement<HTMLSelectElement>('#card-theme')": "requireElement('#card-theme', HTMLSelectElement)",
              "requireElement<HTMLInputElement>('#card-jokers')": "requireElement('#card-jokers', HTMLInputElement)",
              "requireElement<HTMLButtonElement>('#card-draw')": "requireElement('#card-draw', HTMLButtonElement)",
              "requireElement<HTMLButtonElement>('#card-deck')": "requireElement('#card-deck', HTMLButtonElement)",
              "requireElement<HTMLButtonElement>('#card-shuffle')": "requireElement('#card-shuffle', HTMLButtonElement)",
              "requireElement<HTMLButtonElement>('#card-reset')": "requireElement('#card-reset', HTMLButtonElement)",
              "requireElement<HTMLElement>('#card-hand')": "requireElement('#card-hand', HTMLElement)",
              "requireElement<HTMLElement>('#hand-title')": "requireElement('#hand-title', HTMLElement)",
              "requireElement<HTMLElement>('#card-status')": "requireElement('#card-status', HTMLElement)",
          }
          path = Path('src/cards-demo.ts')
          source = path.read_text()
          for before, after in calls.items():
              if source.count(before) != 1:
                  raise SystemExit(f'cards demo call {before}: expected one match, found {source.count(before)}')
              source = source.replace(before, after, 1)
          path.write_text(source)
          PY
      - name: Remove one-time migration files
        run: rm -f scripts/agent-physical-main-migration.mjs .github/workflows/agent-physical-migration.yml .agent-physical-migration-trigger
      - name: Install pnpm
        run: npm install --global pnpm@11.17.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed sources
        run: pnpm exec oxfmt src/main.ts src/physical-die-visuals.ts src/physical-dices.ts packages/sdk/src/deck.ts src/fallback-visuals-base.ts src/cards-demo.ts scripts/test-visual-fallbacks.mjs
      - name: Lint
        run: env -u GITHUB_ACTIONS pnpm lint
      - name: Typecheck packages
        run: pnpm check:packages
      - name: Typecheck browser engine
        run: pnpm exec tsc --noEmit
      - name: Physical architecture smoke
        run: pnpm test:visual-fallbacks
      - name: Generated geometry regression
        run: pnpm test:generated-polyhedra
      - name: Commit validated migration
        run: |
          if git diff --quiet; then
            echo "No migration changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "finish physical die architecture migration"
          git push origin HEAD:agent/dicebox-learnings-cards
