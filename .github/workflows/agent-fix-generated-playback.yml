name: Agent generated physical playback fix

on:
  push:
    branches:
      - agent/dicebox-learnings-cards
    paths:
      - .github/workflows/agent-fix-generated-playback.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dicebox-learnings-cards
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Apply generated physical playback fix
        run: node scripts/agent-fix-generated-playback.mjs

      - name: Remove one-time migration files
        run: |
          rm scripts/agent-fix-generated-playback.mjs
          rm .github/workflows/agent-fix-generated-playback.yml

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed sources
        run: pnpm exec oxfmt --write src/main.ts src/physical-die-visuals.ts scripts/test-visual-fallbacks.mjs tests/browser/specs/overlay.spec.ts

      - name: Typecheck packages
        run: pnpm check:packages

      - name: Typecheck browser engine
        run: pnpm exec tsc --noEmit

      - name: Physical architecture smoke
        run: pnpm test:visual-fallbacks

      - name: Generated polyhedra regression
        run: pnpm test:generated-polyhedra

      - name: Natural physics regression
        run: pnpm test:natural-targets

      - name: Concurrent table regression
        run: pnpm test:concurrent-table

      - name: Core regression
        run: pnpm test:core

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Generated dice visible during overlay roll
        run: pnpm test:browser:build && pnpm exec playwright test tests/browser/specs/overlay.spec.ts --project=chromium

      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m 'animate generated dice through physical replay'
          git push origin HEAD:agent/dicebox-learnings-cards
