# Temporary self-removing validation workflow.
name: Agent runtime identity refactor

on:
  pull_request:
    branches:
      - agent/dicebox-learnings-cards

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Apply identity refactor
        run: |
          node --check scripts/agent-refactor-runtime-identity.mjs
          node scripts/agent-refactor-runtime-identity.mjs
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'src/main.ts';
          let source = await readFile(path, 'utf8');
          const before = `  return getPendingPhysicalLaunchParticipants(physicalTable.visualInstances()).map((entry) => ({\n    ...entry,\n    physicalIndex: physicalTable.physicalIndexForVisual(entry.visualIndex),\n  }));`;
          const after = `  return getPendingPhysicalLaunchParticipants(physicalTable.visualInstances()).map((entry) => ({\n    visualIndex: entry.visualIndex,\n    radius: entry.radius,\n    coinLike: entry.coinLike,\n    physicalIndex: physicalTable.physicalIndexForVisual(entry.visualIndex),\n  }));`;
          if (!source.includes(before)) throw new Error('Pending visual launch mapping marker missing');
          source = source.replace(before, after);
          await writeFile(path, source);
          NODE
          cat > tests/browser/specs/additive-duplicate-id.spec.ts <<'EOF'
          import { expect, test } from '@playwright/test';
          import { waitForFixture } from '../support/fixture';

          test('runtime table identity is independent from roll-scoped logical die ids', async ({ page }) => {
            await page.goto('/host.html');
            await waitForFixture(page);
            const frame = page.frameLocator('iframe[title="Draftroll dice overlay"]');

            await frame.locator('body').evaluate(() =>
              window.draftrollDice.roll({
                physical: [
                  {
                    id: 'die_1',
                    type: 'd9',
                    sides: 9,
                    outcomeIndex: 3,
                    result: 4,
                    numericValue: 4,
                    title: 'd9',
                    label: '4',
                    theme: 'dragon',
                    outcome: 'neutral',
                  },
                ],
                visualOrder: [{ kind: 'physical', index: 0, dieId: 'die_1' }],
                seed: 'duplicate-generated-first',
                animationDurationMs: 720,
              }),
            );

            await frame.locator('body').evaluate(() =>
              window.draftrollDice.roll({
                physical: [
                  {
                    id: 'die_1',
                    type: 'd11',
                    sides: 11,
                    outcomeIndex: 6,
                    result: 7,
                    numericValue: 7,
                    title: 'd11',
                    label: '7',
                    theme: 'dragon',
                    outcome: 'neutral',
                  },
                ],
                visualOrder: [{ kind: 'physical', index: 0, dieId: 'die_1' }],
                seed: 'duplicate-generated-second',
                animationDurationMs: 720,
                tableMode: 'add',
              }),
            );

            await frame.locator('body').evaluate(() =>
              window.draftrollDice.roll({
                physical: [
                  {
                    id: 'die_1',
                    type: 'd6',
                    sides: 6,
                    outcomeIndex: 1,
                    result: 2,
                    numericValue: 2,
                    canonicalKind: 'd6',
                    title: 'd6',
                    label: '2',
                    theme: 'dragon',
                    outcome: 'neutral',
                  },
                ],
                visualOrder: [{ kind: 'physical', index: 0, dieId: 'die_1' }],
                seed: 'duplicate-canonical-third',
                animationDurationMs: 720,
                tableMode: 'add',
              }),
            );

            const snapshot = await frame
              .locator('body')
              .evaluate(() => window.draftrollDice.getPhysicalSnapshot());
            expect(snapshot).toHaveLength(3);
            expect(snapshot.map((entry) => entry.id)).toEqual(['die_1', 'die_1', 'die_1']);
            expect(snapshot.map((entry) => entry.physicalIndex)).toEqual([0, 1, 2]);
            expect(snapshot.map((entry) => entry.implementation)).toEqual([
              'generated',
              'generated',
              'canonical',
            ]);
            expect(snapshot.map((entry) => entry.result)).toEqual([4, 7, 2]);
            expect(snapshot.every((entry) => entry.visible)).toBe(true);
          });
          EOF
          rm scripts/agent-refactor-runtime-identity.mjs
          rm .github/workflows/agent-runtime-identity-refactor.yml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: >-
          pnpm exec oxfmt --write
          packages/protocol/src/index.ts
          packages/core/src/evaluator.ts
          packages/core/src/index.ts
          packages/renderer/src/index.ts
          src/physical-table.ts
          src/physical-die-visuals.ts
          src/physical-launch.ts
          src/main.ts
          scripts/test-visual-fallbacks.mjs
          scripts/test-roll-updates.mjs
          tests/browser/specs/additive-duplicate-id.spec.ts
          docs/ARCHITECTURE.md

      - name: Verify formatting
        run: >-
          pnpm exec oxfmt --check
          packages/protocol/src/index.ts
          packages/core/src/evaluator.ts
          packages/core/src/index.ts
          packages/renderer/src/index.ts
          src/physical-table.ts
          src/physical-die-visuals.ts
          src/physical-launch.ts
          src/main.ts
          scripts/test-visual-fallbacks.mjs
          scripts/test-roll-updates.mjs
          tests/browser/specs/additive-duplicate-id.spec.ts
          docs/ARCHITECTURE.md

      - name: Lint and typecheck
        run: |
          pnpm lint
          pnpm exec tsc --noEmit
          pnpm check:packages
          pnpm check:docs

      - name: Core regression
        run: pnpm test:core

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build browser fixtures
        run: pnpm test:browser:build

      - name: Identity browser regression
        run: pnpm exec playwright test tests/browser/specs/additive-duplicate-id.spec.ts --project=chromium

      - name: Physical overlay browser regression
        run: pnpm exec playwright test tests/browser/specs/overlay.spec.ts --project=chromium

      - name: Commit validated refactor
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Refactor produced no changes"
            exit 1
          fi
          git commit -m "separate logical and runtime die identity"
          git push origin HEAD:${{ github.head_ref }}
