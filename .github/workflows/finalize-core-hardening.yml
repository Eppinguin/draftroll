name: Finalize core hardening

on:
  push:
    branches:
      - agent/core-hardening

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'finalize core hardening state'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply source fix and restore read-only CI
        shell: bash
        run: |
          set -euo pipefail

          apply_fixes() {
            node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const path = 'packages/protocol/src/runtime.ts';
          let source = await readFile(path, 'utf8');
          if (!source.includes('function migrateLegacyResultsInServerEvent(')) {
            const decoderBefore = `  const cloned = structuredCloneIfObject(value);
            const context = createContext({ rejectUnknownFields: true, ...options });`;
            const decoderAfter = `  const cloned = structuredCloneIfObject(value);
            if (options.allowLegacyResults ?? true) migrateLegacyResultsInServerEvent(cloned);
            const context = createContext({ rejectUnknownFields: true, ...options });`;
            if (!source.includes(decoderBefore)) {
              throw new Error('Server decoder insertion point not found');
            }
            source = source.replace(decoderBefore, decoderAfter);

            const marker = 'function validateServerEvent(value: unknown, path: string, context: ValidationContext): void {';
            const helper = `function migrateLegacyResultInRoomRollEvent(value: unknown): void {
            if (!isRecord(value)) return;
            if (
              value.type !== 'roll_start' &&
              value.type !== 'roll_updated' &&
              value.type !== 'roll_visibility_updated'
            ) {
              return;
            }
            if (isRecord(value.result) && value.result.schemaVersion === undefined) {
              value.result.schemaVersion = DRAFTROLL_RESULT_SCHEMA_VERSION;
            }
          }

          function migrateLegacyResultsInServerEvent(value: unknown): void {
            if (!isRecord(value)) return;
            migrateLegacyResultInRoomRollEvent(value);
            if (value.type !== 'room_state') return;
            for (const collection of [value.recentEvents, value.recentRolls]) {
              if (!Array.isArray(collection)) continue;
              collection.forEach(migrateLegacyResultInRoomRollEvent);
            }
            migrateLegacyResultInRoomRollEvent(value.recentRoll);
          }

          `;
            if (!source.includes(marker)) {
              throw new Error('Server validation insertion point not found');
            }
            source = source.replace(marker, helper + marker);
            await writeFile(path, source);
          }
          NODE

            cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            pull_request:
              branches:
                - main
                - dev
            push:
              branches:
                - main
                - dev

          permissions:
            contents: read

          jobs:
            quality:
              name: Quality and type safety
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v4
                - uses: pnpm/action-setup@v4
                  with:
                    version: 11.17.0
                    run_install: false
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22.13.0
                    cache: pnpm
                - run: pnpm install --frozen-lockfile
                - run: pnpm check
                - name: Print lint diagnostics
                  if: failure()
                  run: pnpm exec oxlint . --format=agent || true

            core-tests:
              name: Core regression tests
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                - uses: pnpm/action-setup@v4
                  with:
                    version: 11.17.0
                    run_install: false
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22.13.0
                    cache: pnpm
                - run: pnpm install --frozen-lockfile
                - name: Engine and evaluation
                  run: pnpm test:core:engine
                - name: SDK and realtime lifecycle
                  run: pnpm test:core:sdk-realtime
                - name: Mixed renderer
                  run: pnpm test:mixed-renderer
                - name: Coin and canonical physics
                  run: pnpm test:coin-physics
                - name: Visual fallbacks
                  run: pnpm test:visual-fallbacks
                - name: Generated polyhedra
                  run: pnpm test:generated-polyhedra
                - name: Card presentation
                  run: pnpm test:cards-demo
                - name: Runtime themes
                  run: pnpm test:themes
                - name: Character client
                  run: pnpm test:client
                - name: Room protocol
                  run: pnpm test:room-protocol
                - name: Runtime validation
                  run: pnpm test:validation
                - name: Room hardening
                  run: pnpm test:hardening
                - name: Room password
                  run: pnpm test:password
                - name: Token security
                  run: pnpm test:tokens
                - name: Late events
                  run: pnpm test:late-events
                - name: Concurrent table rolls
                  run: pnpm test:concurrent-table
                - name: Physics and package entrypoints
                  run: pnpm test:core:physics
                - name: Public state isolation
                  run: node scripts/test-state-isolation.mjs

            release-contract:
              name: Package and release contract
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v4
                - uses: pnpm/action-setup@v4
                  with:
                    version: 11.17.0
                    run_install: false
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22.13.0
                    cache: pnpm
                - run: pnpm install --frozen-lockfile
                - run: pnpm test:release

            browser-chromium:
              name: Browser regression tests (Chromium)
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                - uses: pnpm/action-setup@v4
                  with:
                    version: 11.17.0
                    run_install: false
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22.13.0
                    cache: pnpm
                - run: pnpm install --frozen-lockfile
                - run: pnpm exec playwright install --with-deps chromium
                - run: pnpm test:browser:chromium
          YAML

            rm -f .github/workflows/finalize-core-hardening.yml
          }

          for attempt in 1 2 3; do
            git fetch origin agent/core-hardening
            git reset --hard origin/agent/core-hardening
            apply_fixes

            if git diff --quiet; then
              exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/protocol/src/runtime.ts .github/workflows/ci.yml .github/workflows/finalize-core-hardening.yml
            git commit -m "finalize core hardening state"
            if git push origin HEAD:agent/core-hardening; then
              exit 0
            fi
          done

          echo "Failed to finalize branch after retries" >&2
          exit 1
