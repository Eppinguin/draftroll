name: Agent physical architecture cleanup

on:
  push:
    branches:
      - agent/dicebox-learnings-cards

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dicebox-learnings-cards
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Apply focused architecture cleanup
        run: |
          node --check scripts/agent-clean-physical-architecture.mjs
          node scripts/agent-clean-physical-architecture.mjs
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          {
            const path = 'src/main.ts';
            let source = await readFile(path, 'utf8');
            const beforeSelection = `  selectedKind = kinds[0] ?? 'd20';\n  selectedTheme = physical[0]?.theme ?? fallbacks[0]?.theme ?? 'dragon';\n  resetPhysicalTable(physical);\n  activeKinds = kinds;`;
            const afterSelection = `  selectedKind = kinds[0] ?? 'd20';\n  selectedTheme = physical[0]?.theme ?? fallbacks[0]?.theme ?? 'dragon';\n  activeKinds = kinds;`;
            if (!source.includes(beforeSelection)) throw new Error('replay registry pre-reset block is missing');
            source = source.replace(beforeSelection, afterSelection);
            const beforePreview = `  world.gravity.set(0, -PHYSICS_PRESETS[activePhysicsPreset].gravity, 0);\n  spawnPreview(activeKinds, true);\n  applyRuntimeQuality(totalVisuals);`;
            const afterPreview = `  world.gravity.set(0, -PHYSICS_PRESETS[activePhysicsPreset].gravity, 0);\n  spawnPreview(activeKinds, true);\n  resetPhysicalTable(physical);\n  applyRuntimeQuality(totalVisuals);`;
            if (!source.includes(beforePreview)) throw new Error('replay preview ordering block is missing');
            source = source.replace(beforePreview, afterPreview);
            await writeFile(path, source);
          }

          {
            const path = 'scripts/test-visual-fallbacks.mjs';
            let source = await readFile(path, 'utf8');
            const before = `assert.match(physicalVisuals, /new Map<string, PhysicalDieVisualInstance>/);\nassert.match(physicalVisuals, /physicalIndex: number/);\nassert.doesNotMatch(physicalVisuals, /extractPhysicalTransforms|trajectoryForIndex/);\nassert.doesNotMatch(physicalVisuals, /AdditionalPhysical|additionalPhysical/);\nassert.match(physicalVisuals, /activePhysicalDice/);\nassert.match(physicalVisuals, /pendingPhysicalDice/);`;
            const after = `assert.doesNotMatch(physicalVisuals, /new Map<string, PhysicalDieVisualInstance>/);\nassert.match(physicalVisuals, /physicalIndex: number/);\nassert.doesNotMatch(physicalVisuals, /extractPhysicalTransforms|trajectoryForIndex/);\nassert.doesNotMatch(physicalVisuals, /AdditionalPhysical|additionalPhysical/);\nassert.doesNotMatch(physicalVisuals, /activePhysicalDice|pendingPhysicalDice/);`;
            if (!source.includes(before)) throw new Error('legacy visual registry assertion block is missing');
            source = source.replace(before, after);
            const oldRegistry = `assert.match(physicalTable, /class PhysicalTableRegistry/);\nassert.match(physicalTable, /forEachVisual/);\nassert.doesNotMatch(engine, /physicalTable\\.visualInstances/);`;
            const newRegistry = `assert.match(physicalTable, /class PhysicalTableRegistry/);\nassert.match(physicalTable, /forEachVisual/);\nassert.match(physicalTable, /visualInstances/);\nassert.match(physicalTable, /preserveBindings/);\nassert.match(physicalTable, /Physical table canonical index is missing/);\nassert.match(engine, /physicalTable\\.visualInstances\\(\\)/);`;
            if (!source.includes(oldRegistry)) throw new Error('legacy physical table assertion block is missing');
            source = source.replace(oldRegistry, newRegistry);
            const oldMeshOwnership = `assert.match(physicalMesh, /ownedTextures/);`;
            const newMeshOwnership = `assert.doesNotMatch(physicalMesh, /ownedTextures/);\nassert.match(physicalMesh, /runtimeSurface \\? null : acquireSurfaceTexture/);\nassert.match(physicalMesh, /generatedSurface\\?\\.release/);`;
            if (!source.includes(oldMeshOwnership)) throw new Error('legacy mesh ownership assertion is missing');
            source = source.replace(oldMeshOwnership, newMeshOwnership);
            await writeFile(path, source);
          }
          NODE
          git rm -f .DS_Store
          rm scripts/agent-clean-physical-architecture.mjs
          rm .github/workflows/agent-physical-architecture-cleanup.yml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed source
        run: >-
          pnpm exec oxfmt --write
          src/main.ts
          src/physical-table.ts
          src/physical-die-visuals.ts
          src/physical-die-mesh.ts
          src/overlay.css
          scripts/test-visual-fallbacks.mjs
          docs/ARCHITECTURE.md

      - name: Verify changed source formatting
        run: >-
          pnpm exec oxfmt --check
          src/main.ts
          src/physical-table.ts
          src/physical-die-visuals.ts
          src/physical-die-mesh.ts
          src/overlay.css
          scripts/test-visual-fallbacks.mjs
          docs/ARCHITECTURE.md

      - name: Lint and type checks
        run: >-
          pnpm lint &&
          pnpm test:quality-config &&
          pnpm check:docs &&
          pnpm check:packages &&
          pnpm check:worker &&
          pnpm exec tsc --noEmit

      - name: Core regression
        run: pnpm test:core

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build browser fixtures
        run: pnpm test:browser:build

      - name: Overlay browser regression
        run: pnpm exec playwright test tests/browser/specs/overlay.spec.ts --project=chromium

      - name: Commit validated cleanup
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Cleanup produced no changes"
            exit 1
          fi
          git commit -m "clean physical runtime architecture"
          git push origin HEAD:agent/dicebox-learnings-cards
